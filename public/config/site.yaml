# ─────────────────────────────────────────────────────────────
#  Niijima Network — site config
#  Read on every page load: edit, save, reload. No rebuild.
#  (Docker mounts this folder; JSON works too if you prefer.)
# ─────────────────────────────────────────────────────────────

domain: niijimasisters.com      # anything.<domain> that isn't listed here lands on the 404 Palace
title: Niijima Network

# The cut between the sisters: torn (ragged paper, white showing through) or clean (the guillotine bolt)
edge: torn

# Clicking a sister: network = slash into the menu with her selected · site = straight to her subdomain
sisterOpens: network

# The landing split. First = left (top on phones), second = right (bottom).
#   status   online · soon (COMING SOON stamp, click shows the stamp instead of leaving)
#   render   transparent WebP or PNG in /assets; a missing .webp falls back to the .png of the same name,
#            and a missing file just shows the placeholder slot
#   renderFit: cover  → fills the slot (square bust-ups). Leave it out for full-body cutouts.
#   renderFlip: true  → mirror so she faces the cut
sisters:
  - id: makoto
    name: Makoto
    host: makoto.niijimasisters.com
    status: online
    arcana: II
    plates: [Codename · Queen, II · Priestess]
    tagline: Council president. Strategist. Iron fist.
    render: /assets/makoto-landing.webp
    renderFit: cover
    renderFlip: true

  - id: sae
    name: Sae
    host: sae.niijimasisters.com
    status: online
    arcana: XX
    glyph: "§"                   # giant watermark on her side
    plates: [Public prosecutor, XX · Judgement]
    tagline: The prosecution never rests.
    render: /assets/sae-landing.webp
    renderFit: cover

# "Take your time" — shown on first paint and between the shard wipe and leaving for a subdomain.
#   type: image  → a GIF / animated WebP, played as-is (e.g. /assets/loader.gif)
#   type: sprite → horizontal strip of equal frames (works everywhere)
#   type: video  → .webm/.mp4 (transparency won't survive on iPhone; sprite is safer)
#   type: none   → spinning thief-star placeholder
loader:
  type: none
  src: /assets/loader.png
  frames: 16
  fps: 24
  size: 160            # displayed height in px
  text: Take your time
  minDuration: 900     # ms it stays up before navigating

# Date HUD in the Network screen (the in-game calendar). Weather from open-meteo.com — free, no key.
calendar:
  timezone: Europe/Budapest
  weather: true
  latitude: 47.4979
  longitude: 19.0402

# ONLINE / OFFLINE in the Network menu.
#   kuma: Uptime Kuma status-page JSON. Same-origin through Traefik is easiest (see docker-compose.example.yml):
#         /api/status-page/heartbeat/niijima
#         Entries with a monitorId get real up / down / pending / maintenance.
#   ping: everything else that's 'online' gets a no-cors ping (answered = ONLINE, error/5 s timeout = DOWN).
status:
  kuma: ""
  interval: 60
  ping: true

# UI sounds. Drop your files in /assets/sfx with these names (wav/ogg/mp3). Missing files are silent.
sounds:
  hover: /assets/sfx/hover.wav       # a sister's half lights up
  move: /assets/sfx/move.wav         # menu cursor moves
  confirm: /assets/sfx/confirm.wav   # something is chosen
  slash: /assets/sfx/slash.wav       # shard transition into the Network
  back: /assets/sfx/back.wav         # Esc / BACK
  error: /assets/sfx/error.wav       # a coming-soon or locked entry
soundVolume: 0.6

# Where the menu list comes from. Can later point at an /api/services JSON endpoint.
servicesSource: /config/services.yaml
