server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Config is edited live — never cache it.
    location /config/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Your art. Cached for a day; bump the filename if you replace an image and want it instant.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Hashed build output — safe to cache forever.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (including unknown subdomains sent here by Traefik's catch-all)
    # gets the app, which decides between the split screen and the 404 Palace.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/yaml application/yaml;
}
