# A subdomain only reaches this container through Traefik's catch-all, i.e. nothing else claimed it.
# Those (and unknown paths) still get the app, which draws the 404 Palace, but with a real 404 status
# so uptime monitors and search engines don't treat them as working pages.
map $host $nj_catchall {
    default 0;
    "~^(?!www\.)[^.]+(\.[^.]+)*\.[^.]+\.[a-z]+$" 1;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Config is edited live — never cache it.
    location /config/ {
        types { application/yaml yaml yml; application/json json; }
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Your art and sounds. Cached for a day; bump the filename if you replace one and want it instant.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Hashed build output — safe to cache forever.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The split screen lives at / on the root domain only.
    location = / {
        if ($nj_catchall) { return 404; }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Anything else that isn't a real file is a 404, drawn by the app as the 404 Palace.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/yaml application/yaml;
}
